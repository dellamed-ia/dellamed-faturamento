name: Atualizar dashboard

on:
  schedule:
    - cron: "30 11 * * *"   # 08:30 em Brasília (11:30 UTC)
  workflow_dispatch:        # botão "Run workflow" para atualizar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Extrair dados do Qlik
        env:
          QLIK_TENANT: ${{ secrets.QLIK_TENANT }}
          QLIK_APP_ID: ${{ secrets.QLIK_APP_ID }}
          QLIK_API_KEY: ${{ secrets.QLIK_API_KEY }}
        run: python scripts/extract_qlik.py --config config/qlik.json --out build/data.json

      - name: Montar página criptografada
        env:
          DASHBOARD_PIN: ${{ secrets.DASHBOARD_PIN }}
        run: python scripts/build.py --data build/data.json --out index.html

      - name: Apagar dados abertos
        if: always()
        run: rm -rf build

      - name: Publicar
        run: |
          git config user.name  "dellamed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Atualização automática $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')" || echo "Sem mudanças"
          git push
